name: design-system-validator

agentkit: generateDesignSystemAgentKit
description: Generate AIditor add-menu entries from DESIGN.md tokens

actions:
  # DL#180: settings-page actions — browser-callable from the devOnly /design-system/settings route,
  # use the compiler via run-design-analysis. Handlers live in ./tools; excluded from production.
  - name: getDesignSystemSettingsStatus
    devOnly: true
  - name: runDesignSystemAnalysis
    devOnly: true
  - name: loadDesignSystemAddMenuCatalog
    devOnly: true
  - name: saveDesignSystemAddMenuCatalog
    devOnly: true
  - name: regenerateDesignSystemAddMenu
    devOnly: true
  # Production action (compiler-free, @capsizecss only) — stays on the serve entry (`.`).
  - name: fontFallback
    action: font-fallback.jay-action

routes:
  - path: /design-system/settings
    jayHtml: ./dist/pages/settings/page.jay-html
    component: designSystemSettingsPage
    description: Design system project settings — token overview, analysis report, add-menu regeneration
    devOnly: true

validators:
  - name: design-tokens
    handler: validateTokens
    description: Validates CSS values against DESIGN.md tokens (colors, spacing, rounded, typography)

  - name: design-components
    handler: validateComponents
    description: 'Validates component styles against DESIGN.md component specs (HTML and jay: components)'

  - name: design-structure
    handler: validateStructure
    description: Enforces structural design rules (max font weights, primary button count)

  - name: design-contrast
    handler: validateContrast
    description: Checks WCAG AA color contrast compliance on statically determinable color pairs

  - name: font-fallbacks
    handler: validateFontFallbacks
    description: Detects web fonts loaded via @font-face URL without a metric-matched local fallback (causes CLS)

  - name: undefined-vars
    handler: validateUndefinedVars
    description: Flags CSS var(--name) references that are never defined as custom properties
